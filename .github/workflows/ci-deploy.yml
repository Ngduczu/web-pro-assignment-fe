name: Frontend CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Lint, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify production image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-and-deploy:
    name: Publish image and deploy to VPS
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ngduczu/web-pro-assignment-fe
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy frontend to VPS
        env:
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -eu
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in repository Actions secrets}"
          : "${DEPLOY_USER:?Set DEPLOY_USER in repository Actions secrets}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY in repository Actions secrets}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in repository Actions secrets}"
          : "${DEPLOY_PATH:?Set DEPLOY_PATH in repository Actions secrets}"
          SSH_PORT="${SSH_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/lms_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/lms_deploy" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/lms_deploy" -p "$SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" frontend "$GITHUB_SHA" <<'REMOTE'
          set -eu
          cd "$1"
          ./deploy.sh "$2" "$3"
          REMOTE
          rm -f "$HOME/.ssh/lms_deploy"
